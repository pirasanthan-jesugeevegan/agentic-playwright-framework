name: Playwright Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      generate_vr_baselines:
        description: "Regenerate visual-regression baselines on Linux instead of running the suite (state the reason in this run's description)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    if: ${{ !inputs.generate_vr_baselines }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # visual-regression stays out of the default matrix until its baselines
        # are generated and committed via generate-vr-baselines below - add
        # 'visual-regression' back here once tests/vr/**/*.png exist.
        project: [chromium, firefox, webkit, mobile-chrome, mobile-safari, api]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm install -g pnpm && pnpm install
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Run Playwright tests
        env:
          ENV: dev
          PW_WORKERS: 10
        run: pnpm exec playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results/
          retention-days: 30

  publish-report:
    needs: test
    if: ${{ !cancelled() && needs.test.result != 'skipped' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm install -g pnpm && pnpm install
      - uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true
      - name: Generate Allure report
        run: pnpm exec allure generate ./allure-results --clean -o ./allure-report

      - name: Prove the contract verifier works
        run: |
          node scripts/qa-showcase/verify-contract.mjs --base scripts/qa-showcase/fixtures/report-good > /dev/null
          if node scripts/qa-showcase/verify-contract.mjs --base scripts/qa-showcase/fixtures/report-drifted > /dev/null 2>&1; then
            echo "The verifier accepted a report that has drifted. It is broken."
            exit 1
          fi
          echo "The verifier passes a good report and rejects a drifted one."

      - name: Explain any failures with AI diagnosis
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/qa-showcase/explain-failures.mjs --results-dir ./allure-results --status-md ./docs/STATUS.md --out ./allure-report/ai-diagnosis.json

      - name: Verify the report against the contract before publishing
        run: node scripts/qa-showcase/verify-contract.mjs --base ./allure-report

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report
      - id: deployment
        uses: actions/deploy-pages@v4

  generate-vr-baselines:
    if: ${{ inputs.generate_vr_baselines }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm install -g pnpm && pnpm install
      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps
      - name: Regenerate visual-regression baselines
        env:
          ENV: dev
        run: pnpm exec playwright test --project=visual-regression --update-snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: vr-baselines
          path: tests/vr/**/*-snapshots/**/*.png
          retention-days: 14
